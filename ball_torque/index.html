<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指がボールを回す：トルク τ = r × F</title>
<meta name="description" content="指がボールに加える力 F と、その作用線から、ボールを回すトルク τ = r × F を 2 次元で確かめる図。">
<!-- ===== リンクカード（X / Facebook）: og:image は https:// から始まる絶対 URL が必要 ===== -->
<meta property="og:type" content="website">
<meta property="og:title" content="指がボールを回す：トルク τ = r × F">
<meta property="og:description" content="指がボールに加える力と作用線から、ボールを回すトルクを確かめる図。押す点を作用線に沿ってずらしてもトルクは同じ。">
<meta property="og:url" content="https://skill-vis.github.io/biomechanics/ball_torque/">
<meta property="og:image" content="https://skill-vis.github.io/biomechanics/ball_torque/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #222; line-height: 1.6;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", Meiryo, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 32px; }
  h1 { font-size: 1.55rem; color: #1e4d7b; margin: 0.2em 0 0.6em; line-height: 1.35; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 1.25rem; } }
  #btSvg { border-radius: 6px 6px 0 0; }
  .controls { background: #e6ecf3; border: 2px solid #1e4d7b; border-top: none; border-radius: 0 0 6px 6px;
              padding: 10px 14px; display: grid; gap: 8px; font-size: 0.95rem; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { white-space: nowrap; font-weight: bold; min-width: 8.5em; }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: #1e4d7b; height: 26px; }
  .val { font-family: ui-monospace, Menlo, monospace; font-weight: bold; min-width: 3.2em; text-align: right; color: #1e4d7b; }
  .btn { padding: 6px 12px; border: 1px solid #1e4d7b; background: #fff; color: #1e4d7b; font-size: 0.95rem; cursor: pointer; border-radius: 4px; }
  .btn:hover { background: #e8f0fa; }
  .box { border-left: 5px solid #1e8449; background: #f1f8ee; padding: 10px 14px; margin: 0 0 12px; }
  .box p { margin: 0.25em 0; }
  .v { font-family: "Times New Roman", serif; font-style: italic; font-weight: bold; }
  .r { color: #2448d8; } .f { color: #c0392b; } .t { color: #1e8449; } .o { color: #e07b00; }
  .readout { font-family: ui-monospace, Menlo, monospace; font-size: 1.1rem; margin: 6px 0 12px; line-height: 1.6; }
  .small { font-size: 0.85rem; color: #777; }
  @media (max-width: 520px) { .row label { min-width: 0; white-space: normal; } }
</style>
</head>
<body>
<div class="wrap">
  <p style="margin:0; font-size:0.85rem;"><a href="../" style="color:#1e4d7b;">← Biomechanics の図の一覧</a></p>
  <h1>指がボールを回す：トルク <span class="v t">τ</span> = <span class="v r">r</span> × <span class="v f">F</span></h1>
  <div class="grid">
    <div>
      <svg id="btSvg" viewBox="0 0 600 520" width="100%" style="display:block; background:#fbfcfe; border:1px solid #dde3ea;" role="img" aria-label="ボール、指の力 F、作用線、トルクの平行四辺形の図"
           font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif">
        <defs>
          <marker id="btMb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2448d8"/></marker>
          <marker id="btMr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/></marker>
          <marker id="btMk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7a838d"/></marker>
          <marker id="btMg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1e8449"/></marker>
          <radialGradient id="btShade" cx="0.38" cy="0.32" r="0.75">
            <stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#f1efe9"/><stop offset="1" stop-color="#d4d0c6"/>
          </radialGradient>
        </defs>
        <!-- ボールが右から左へ飛ぶ: 残像（過去の位置）と進行方向の矢印 -->
        <g id="btFly" opacity="0.9">
          <circle cx="420" cy="270" r="148" fill="none" stroke="#9c958a" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="6 6"/>
          <circle cx="370" cy="270" r="148" fill="none" stroke="#9c958a" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="6 6"/>
          <text x="585" y="140" font-size="15" fill="#9c958a" text-anchor="end">少し前の位置</text>
          <line x1="250" y1="482" x2="70" y2="482" stroke="#7a838d" stroke-width="6" marker-end="url(#btMk)"/>
          <text x="262" y="489" font-size="18" fill="#7a838d" font-weight="bold">ボールが飛ぶ向き（捕手の方へ）</text>
        </g>
        <circle id="btBall" fill="url(#btShade)" stroke="#9c958a" stroke-width="2"/>
        <path id="btSeam1" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="2 5" opacity="0.7"/>
        <path id="btSeam2" fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="2 5" opacity="0.7"/>
        <!-- トルクの平行四辺形（r と F が張る。面積 = |τ| に比例）。ずらした点の分は破線 -->
        <polygon id="btPara2" fill="#1e8449" fill-opacity="0.10" stroke="#1e8449" stroke-width="1.5" stroke-dasharray="6 4" opacity="0"/>
        <polygon id="btPara" fill="#1e8449" fill-opacity="0.22" stroke="#1e8449" stroke-width="1.5"/>
        <!-- 作用線 -->
        <line id="btLine" stroke="#777" stroke-width="2" stroke-dasharray="9 6"/>
        <text id="btLineL" font-size="18" fill="#666">作用線</text>
        <!-- 中心から作用線までの距離 d（垂線） -->
        <line id="btD" stroke="#e07b00" stroke-width="3"/>
        <polyline id="btRA" fill="none" stroke="#e07b00" stroke-width="2"/>
        <text id="btDL" font-size="20" fill="#e07b00" font-weight="bold" font-style="italic">d</text>
        <!-- r, F, ずらした点 -->
        <line id="btR" stroke="#2448d8" stroke-width="6" marker-end="url(#btMb)"/>
        <line id="btR2" stroke="#2448d8" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#btMb)" opacity="0"/>
        <line id="btF" stroke="#c0392b" stroke-width="7" marker-end="url(#btMr)"/>
        <line id="btF2" stroke="#c0392b" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#btMr)" opacity="0"/>
        <!-- トルクの回転の矢印 -->
        <path id="btTau" fill="none" stroke="#1e8449" stroke-width="6" marker-end="url(#btMg)"/>
        <circle id="btO" r="7" fill="#8fd16f" stroke="#2c5e1a" stroke-width="2"/>
        <!-- 指（指先が触れた点にあり、F の向きに押している） -->
        <g id="btFinger">
          <path id="btFingerBody" fill="#f2c9a5" stroke="#8a5a3c" stroke-width="2.5" stroke-linejoin="round"/>
          <path id="btNail" fill="#fbe7d9" stroke="#b07a58" stroke-width="1.5"/>
        </g>
        <circle id="btP" r="9" fill="#2448d8"/>
        <circle id="btQ" r="7" fill="#fff" stroke="#2448d8" stroke-width="3" opacity="0"/>
        <g font-size="26" font-weight="bold" font-style="italic" stroke="#fff" stroke-width="5" paint-order="stroke">
          <text id="btLr" fill="#2448d8">r</text>
          <text id="btLF" fill="#c0392b">F</text>
          <text id="btLt" fill="#1e8449">τ</text>
        </g>
        <text id="btLP" font-size="16" fill="#2448d8" font-weight="bold">指が触れた点</text>
      </svg>
      <div class="controls">
        <div class="row"><label class="r" for="btPhi">指が触れる位置</label>
          <input id="btPhi" type="range" min="0" max="360" step="1" value="37"><span class="val" id="btPhiV">37°</span></div>
        <div class="row"><label class="f" for="btAlp">力 F の向き</label>
          <input id="btAlp" type="range" min="0" max="360" step="1" value="253"><span class="val" id="btAlpV">253°</span></div>
        <div><button class="btn" id="btSlide" type="button">押す点を作用線に沿ってずらす</button></div>
      </div>
    </div>
    <div>
      <div class="box">
        <p>トルクの大きさ ＝ 力の大きさ × 中心から作用線までの距離 <span class="v o">d</span></p>
        <p>＝ <b class="t">緑の平行四辺形の面積</b></p>
      </div>
      <p class="readout">
        d = <b class="o" id="btOutD">0.000</b> m<br>
        τ = <b class="t" id="btOutT">0.00</b> N·m <span id="btOutDir" style="color:#555; font-size:0.9em;"></span>
      </p>
      <p>押す点を作用線に沿ってずらしても、トルクは変わらない。</p>
      <p class="small">ボールの半径 0.037 m、|F| = 50 N は説明用の値。</p>
    </div>
  </div>
</div>
<script>
// =====================================================================
// 野球のボール：力の作用線とトルク（2 次元。Desmos 非依存）
//  ボールの中心を原点、半径 R = 0.037 m。指が触れる点 P = R(cos φ, sin φ)、力 F = |F|(cos α, sin α)、|F| = 50 N。
//  τ = r × F の z 成分 = r_x F_y − r_y F_x（正 = 反時計回り）。作用線までの距離 d = |τ| / |F|。
//  「ずらす」ボタン: 押す点を作用線上で P → P + sF と動かしても τ が変わらないことを見せる。
// =====================================================================
(function () {
  const $ = id => document.getElementById(id);
  if (!$('btSvg')) return;
  const CX = 300, CY = 270, S = 4000;            // 1 m = 4000 px（ボールの半径 148 px）
  const R = 0.037, FMAG = 50, FD = 0.042;         // F の矢印の表示長さ [m 相当]
  const X = x => CX + S * x, Y = y => CY - S * y;
  const setL = (id, a, b) => { const e = $(id); e.setAttribute('x1', X(a[0])); e.setAttribute('y1', Y(a[1])); e.setAttribute('x2', X(b[0])); e.setAttribute('y2', Y(b[1])); };
  const setT = (id, p, dx, dy) => { const e = $(id); e.setAttribute('x', X(p[0]) + (dx || 0)); e.setAttribute('y', Y(p[1]) + (dy || 0)); };
  const setC = (id, p) => { $(id).setAttribute('cx', X(p[0])); $(id).setAttribute('cy', Y(p[1])); };
  $('btBall').setAttribute('cx', CX); $('btBall').setAttribute('cy', CY); $('btBall').setAttribute('r', S * R);
  // 縫い目（見た目だけ）
  const seam = sgn => { let d = ''; for (let k = 0; k <= 40; k++) { const t = -1.2 + 2.4 * k / 40; const x = sgn * (0.62 * R + 0.25 * R * Math.cos(t * 1.3)), y = R * 0.92 * Math.sin(t); d += (k ? ' L ' : 'M ') + X(x) + ' ' + Y(y); } return d; };
  $('btSeam1').setAttribute('d', seam(1)); $('btSeam2').setAttribute('d', seam(-1));
  setC('btO', [0, 0]);
  let slide = 0, anim = null;
  function draw() {
    const phi = +$('btPhi').value * Math.PI / 180, alp = +$('btAlp').value * Math.PI / 180;
    const P = [R * Math.cos(phi), R * Math.sin(phi)], u = [Math.cos(alp), Math.sin(alp)];
    const tau = FMAG * (P[0] * u[1] - P[1] * u[0]);           // N·m（z 成分）
    const d = Math.abs(tau) / FMAG;
    // 作用線（P を通り u の向き）
    const L = 0.11; setL('btLine', [P[0] - L * u[0], P[1] - L * u[1]], [P[0] + L * u[0], P[1] + L * u[1]]);
    setT('btLineL', [P[0] + 0.095 * u[0], P[1] + 0.095 * u[1]], 6, -6);
    // 中心から作用線への垂線の足 H
    const s0 = -(P[0] * u[0] + P[1] * u[1]);
    const H = [P[0] + s0 * u[0], P[1] + s0 * u[1]];
    setL('btD', [0, 0], H);
    setT('btDL', [H[0] / 2, H[1] / 2], 8, -6);
    const n = d > 1e-6 ? [H[0] / d, H[1] / d] : [0, 0], q = 0.006;
    $('btRA').setAttribute('points', [[H[0] - q * n[0], H[1] - q * n[1]], [H[0] - q * n[0] + q * u[0], H[1] - q * n[1] + q * u[1]], [H[0] + q * u[0], H[1] + q * u[1]]].map(p => X(p[0]) + ',' + Y(p[1])).join(' '));
    $('btRA').setAttribute('opacity', d > 0.004 ? 1 : 0);
    // r と F
    setL('btR', [0, 0], P); setC('btP', P);
    {  // 指: 長さ 0.05 m、太さ 0.016 m。先端（丸み）が P、根元は P − 0.05 u（F の反対側）
      const W = 0.008, Lf = 0.05, nx = -u[1], ny = u[0];
      const tip = P, base = [P[0] - Lf * u[0], P[1] - Lf * u[1]];
      const c0 = [tip[0] - W * u[0], tip[1] - W * u[1]];              // 先端の丸みの中心
      const pt = (q) => X(q[0]).toFixed(1) + ' ' + Y(q[1]).toFixed(1);
      const A = [base[0] + W * nx, base[1] + W * ny], B = [c0[0] + W * nx, c0[1] + W * ny];
      const C = [c0[0] - W * nx, c0[1] - W * ny], Dd = [base[0] - W * nx, base[1] - W * ny];
      const rpx = (S * W).toFixed(1);
      $('btFingerBody').setAttribute('d', `M ${pt(A)} L ${pt(B)} A ${rpx} ${rpx} 0 0 1 ${pt(C)} L ${pt(Dd)} Z`);
      const n0 = [c0[0] - 0.012 * u[0], c0[1] - 0.012 * u[1]], w2 = W * 0.6;
      const N1 = [n0[0] + w2 * nx, n0[1] + w2 * ny], N2 = [c0[0] + w2 * nx, c0[1] + w2 * ny];
      const N3 = [c0[0] - w2 * nx, c0[1] - w2 * ny], N4 = [n0[0] - w2 * nx, n0[1] - w2 * ny];
      $('btNail').setAttribute('d', `M ${pt(N1)} L ${pt(N2)} A ${(S*w2).toFixed(1)} ${(S*w2).toFixed(1)} 0 0 1 ${pt(N3)} L ${pt(N4)} Z`);
    }
    const Fv = [FD * u[0], FD * u[1]];
    const poly = (A) => [[0, 0], A, [A[0] + Fv[0], A[1] + Fv[1]], Fv].map(p => X(p[0]) + ',' + Y(p[1])).join(' ');
    $('btPara').setAttribute('points', poly(P));
    setL('btF', P, [P[0] + FD * u[0], P[1] + FD * u[1]]);
    setT('btLr', [P[0] / 2, P[1] / 2], -22, -8);
    setT('btLF', [P[0] + FD * u[0], P[1] + FD * u[1]], 10, 10);
    setT('btLP', P, 16, 26);   // 指と重ならないよう点の右下
    // ずらした点 Q = P + s u（作用線上）
    // 作用線がボールともう一度交わる点（反対側の交点）まで、力の向きに進める
    const sQ = slide * 2 * s0, Q = [P[0] + sQ * u[0], P[1] + sQ * u[1]];
    ['btR2', 'btF2', 'btQ', 'btPara2'].forEach(id => $(id).setAttribute('opacity', slide > 0.02 ? 1 : 0));
    $('btPara2').setAttribute('points', poly(Q));
    setL('btR2', [0, 0], Q); setC('btQ', Q); setL('btF2', Q, [Q[0] + FD * u[0], Q[1] + FD * u[1]]);
    // τ の回転の矢印（大きさに比例した弧、向きは τ の符号）
    const rr = 0.024, span = Math.min(1, Math.abs(tau) / (FMAG * R)) * 1.6 * Math.PI, sg = tau >= 0 ? 1 : -1;
    let dd = '';
    for (let k = 0; k <= 40; k++) { const a = Math.PI / 2 + sg * span * k / 40 - sg * span / 2; dd += (k ? ' L ' : 'M ') + X(rr * Math.cos(a)) + ' ' + Y(rr * Math.sin(a)); }
    $('btTau').setAttribute('d', span > 0.05 ? dd : '');
    setT('btLt', [0, rr], -8, -14);
    $('btPhiV').textContent = $('btPhi').value + '°'; $('btAlpV').textContent = $('btAlp').value + '°';
    $('btOutD').textContent = d.toFixed(3);
    $('btOutT').textContent = Math.abs(tau).toFixed(2);
    $('btOutDir').textContent = Math.abs(tau) < 0.005 ? '（回らない：作用線が中心を通る）' : (tau > 0 ? '（反時計回り）' : '（時計回り）');
  }
  $('btPhi').addEventListener('input', () => { slide = 0; draw(); });
  $('btAlp').addEventListener('input', () => { slide = 0; draw(); });
  $('btSlide').addEventListener('click', () => {
    if (anim) cancelAnimationFrame(anim);
    const t0 = performance.now(), DUR = 2400;
    const step = now => { const u = Math.min(1, (now - t0) / DUR); slide = 0.5 - 0.5 * Math.cos(Math.PI * u); draw();
      anim = u < 1 ? requestAnimationFrame(step) : null; };
    anim = requestAnimationFrame(step);
  });
  window._btDraw = (s) => { slide = s; draw(); };
  draw();
})();
</script>
</body>
</html>
